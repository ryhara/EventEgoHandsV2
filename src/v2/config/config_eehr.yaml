seed: 42
num_workers: 4
# GT mask labels only exist at 30fps; opting in reuses one label for all
# sub-frames when annotation_fps > 30 (misaligned by up to 25ms).
allow_subframe_gt_mask: false
devices: [0]
dataset_mode: "normal"
model: "EfficientNetV2_S"
output_width: 224
output_height: 224
use_center_crop: false
n_channels: 2
mano_hand_model_path: "src/mano/models"
mano_cmps: 45
mano_use_pose_pca: False
output_mano_dim: 122 # 61*2: pose 45, shape 10, global_orient 3, transl 3
focal_length: 5000.0

# Real dataset settings
dataset_type: "real"
real_dataset_root: "/path/to/EEH-R"
real_dataset_fps: 30

# Annotation source: "mano" or "mocap"
annotation_source: "mano"
annotation_fps: 30
# LNES reconstruction from raw events (events/*.h5)
# Forced on when annotation_fps > 30 (no pre-rendered PNG exists for sub-frames).
# Set true to also rebuild the 30fps LNES from h5 (keeps 30/120fps consistent).
lnes_from_h5: false
# LNES integration window in seconds (1/30 matches the stored lnes_frames/*.png)
lnes_window_sec: 0.03333333333333333

# YOLO detector (used when use_gt_mask=false)
yolo_checkpoint_path: ""
yolo_conf_threshold: 0.8
yolo_iou_threshold: 0.45

# Hand crop settings
bbox_expand_ratio: 1.75
use_mask: true # true=mask crop (default for mask model)
mask_dilation_kernel_size: 7
mask_dilation_iterations: 1

# If true, bypass YOLO inference and use mask GT labels as detection source
use_gt_mask: false
gt_mask_root: ""

# Backbone configuration
use_shared_backbone: true

# Attention parameters
use_cross_attention: true
use_self_attention: true
attention_num_heads: 8
attention_dropout: 0.1
use_positional_encoding: true
num_attention_layers: 1

# V2 specific parameters
use_learnable_pos_encoding: true
pos_encoding_base_size: 7
add_pos_encoding_every_layer: true
attention_order: "self_first"

ignore_files_count: 0

train:
  batch_size: 32
  epochs: 30
  lr: 0.00002
  weight_decay: 0.0001

  # Scheduler settings
  use_scheduler: true
  warmup_epochs: 1
  warmup_lr: 1.0e-6
  min_lr: 1.0e-6
  warmup_prefix: true
  cycle_limit: 1

  # Real dataset only, kept for compatibility with shared config schema
  event_input_dir: ""
  gt_file_dir: ""
  rgb_dir: ""
  yolo_image_dir: ""
  lnes_blosc2_dir: ""
  object_library_path: "/path/to/N-HOT3D/assets"
  dataset_divide: 1
  is_get_image: false
  augmentation: false

  save_path: "data/save/"
  log_interval: 10
  save_interval: 5
  checkpoint_path: ""

  # For annotation_source=mocap, unsupported losses are auto-disabled to:
  # ["joints_3d", "vertices", "hand_pose", "shape", "inter_j3d"]
  losses: ["joints_3d", "vertices", "hand_pose", "shape", "inter_j3d"]
  loss_j3d_ratio: 2.0
  loss_vertices_ratio: 2.0
  loss_hand_pose_ratio: 1.0
  loss_shape_ratio: 1.0
  loss_inter_j3d_ratio: 1.0

test:
  batch_size: 16
  event_input_dir: ""
  gt_file_dir: ""
  rgb_dir: ""
  yolo_image_dir: ""
  lnes_blosc2_dir: ""
  object_library_path: "/path/to/N-HOT3D/assets"
  is_get_image: true
  save_path: "data/save/"
  checkpoint_path: ""
  log_interval: 10
  save_interval: 2
